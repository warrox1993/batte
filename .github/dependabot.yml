version: 2

# Mises à jour de version hebdomadaires, groupées pour limiter le nombre de PR :
# les mineures et correctifs arrivent dans une seule PR par écosystème, les
# majeures restent séparées (elles changent des interfaces).
#
# `cooldown` laisse quelques jours à une nouvelle version avant de la proposer :
# une version compromise publiée puis retirée dans l'heure n'est ainsi jamais
# proposée. Il ne s'applique pas aux mises à jour de SÉCURITÉ déclenchées par une
# alerte Dependabot, qui restent immédiates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (compilateur natif) : typescript-eslint, même dans sa
      # dernière version stable (8.70.1 au 28/09/2026), exige typescript
      # « >=4.8.4 <6.1.0 ». La PR #15 (5.9.3 -> 7.0.2) échouait dès `npm ci`
      # (ERESOLVE). À retirer quand typescript-eslint acceptera TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
